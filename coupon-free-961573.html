<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow"><title>Admin Panel</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="/js/firebase-config.js"></script>
<style>.tab-active{background:#1d3266;color:white}.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}</style>
</head><body class="bg-gray-100 p-4 md:p-8"><div id="adminMainContent" class="max-w-4xl mx-auto space-y-6"><div class="flex justify-between border-b pb-4"><h1 class="text-3xl font-extrabold text-[#1d3266]">Admin Panel🦅</h1><a href="/" class="text-xs bg-gray-800 text-white font-bold px-3 py-2 rounded-lg">View Site</a></div>
<div class="bg-white border p-4 rounded-xl flex justify-between items-center"><h3 class="font-bold text-sm">Backup</h3><button onclick="exportAllData()" class="bg-[#1d3266] text-white px-4 py-2 rounded font-bold text-xs">Download Backup</button></div>

<div class="bg-white p-2 rounded-xl shadow border flex gap-2 overflow-x-auto">
<button onclick="showTab('stores')" id="tab-stores" class="tab-active px-4 py-2 rounded-lg font-bold text-xs whitespace-nowrap">Manage Stores</button>
<button onclick="showTab('coupons')" id="tab-coupons" class="bg-gray-100 px-4 py-2 rounded-lg font-bold text-xs whitespace-nowrap">Manage Coupons</button>
<button onclick="showTab('addstore')" id="tab-addstore" class="bg-gray-100 px-4 py-2 rounded-lg font-bold text-xs whitespace-nowrap">Add Store</button>
<button onclick="showTab('addcoupon')" id="tab-addcoupon" class="bg-gray-100 px-4 py-2 rounded-lg font-bold text-xs whitespace-nowrap">Add Coupon</button>
<button onclick="showTab('cats')" id="tab-cats" class="bg-gray-100 px-4 py-2 rounded-lg font-bold text-xs whitespace-nowrap">Categories</button>
</div>

<div id="section-addstore" class="bg-white p-6 rounded-xl shadow border space-y-4"><h2 class="text-xl font-bold text-[#00c98b]">1. Add Store [SEO + Sidebar + FAQ]</h2><form id="addStoreForm" class="grid grid-cols-1 gap-4"><input type="hidden" id="storeEditId"><input type="text" id="storeName" placeholder="Store Name" class="border p-2.5 rounded text-sm" required><input type="file" id="storeImageFile" accept="image/*" class="border p-2.5 rounded text-sm"><img id="previewImg" class="w-20 h-20 object-contain border rounded hidden"><textarea id="storeDesc" placeholder="Long Description - 20-30 words (For read more)" class="border p-2.5 rounded text-sm" rows="4" required></textarea><textarea id="storeAboutBox" placeholder="About Store Box (Sidebar me show hoga)" class="border p-2.5 rounded text-sm bg-blue-50" rows="2"></textarea><div class="border p-3 rounded bg-gray-50 space-y-2"><b class="text-xs">FAQs</b><input id="faq1q" placeholder="FAQ1 Q" class="w-full border p-2 rounded text-xs"><input id="faq1a" placeholder="FAQ1 A" class="w-full border p-2 rounded text-xs"><input id="faq2q" placeholder="FAQ2 Q" class="w-full border p-2 rounded text-xs"><input id="faq2a" placeholder="FAQ2 A" class="w-full border p-2 rounded text-xs"><input id="faq3q" placeholder="FAQ3 Q" class="w-full border p-2 rounded text-xs"><input id="faq3a" placeholder="FAQ3 A" class="w-full border p-2 rounded text-xs"></div><input type="url" id="storeUrl" placeholder="Store URL" class="border p-2.5 rounded text-sm" required><input type="url" id="storeSecUrl" placeholder="Affiliate URL Optional" class="border p-2.5 rounded text-sm"><button type="submit" id="storeSubmitBtn" class="bg-[#1d3266] text-white py-3 rounded-lg font-bold text-sm">Save Store</button></form></div>

<div id="section-addcoupon" class="bg-white p-6 rounded-xl shadow border space-y-4 hidden"><h2 class="text-xl font-bold text-[#00c98b]">2. Add Coupon [With Sequence]</h2><form id="addCouponForm" class="space-y-4"><input type="hidden" id="couponEditId"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><input type="text" id="couponTitle" placeholder="Title" class="border p-2.5 rounded text-sm" required><select id="couponStore" class="border p-2.5 rounded text-sm" required><option value="">Select Store</option></select></div><textarea id="couponDesc" placeholder="Description" class="w-full border p-2.5 rounded text-sm" rows="2"></textarea><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><select id="couponCategory" class="border p-2.5 rounded text-sm" required></select><input type="url" id="couponUrl" placeholder="Target URL" class="border p-2.5 rounded text-sm" required></div>
<div class="grid grid-cols-2 gap-4"><div><label class="text-[11px] font-bold">Offer Sequence (1 = Top)</label><input type="number" id="offerSequence" value="1" min="1" class="w-full border p-2.5 rounded text-sm bg-yellow-50"></div><div class="flex gap-6 py-2 items-end"><label class="flex gap-2 text-sm"><input type="radio" name="type" value="coupon" checked> Coupon</label><label class="flex gap-2 text-sm"><input type="radio" name="type" value="deal"> Deal</label></div></div>
<div id="codeBox"><input type="text" id="couponCode" placeholder="Coupon Code" class="w-full border p-2.5 rounded text-sm"></div><button type="submit" id="couponSubmitBtn" class="w-full bg-[#00c98b] text-white py-3 rounded-lg font-bold text-sm">Publish</button></form></div>

<div id="section-cats" class="bg-white p-6 rounded-xl shadow border space-y-4 hidden"><h2 class="text-xl font-bold text-[#00c98b]">Categories</h2><form id="addCategoryForm" class="flex gap-2"><input type="text" id="newCategoryName" placeholder="New Category" class="border p-2.5 rounded text-sm flex-1" required><button type="submit" class="bg-[#1d3266] text-white px-4 py-2 rounded text-sm font-bold">Add</button></form><div id="adminCategoryList"></div></div>

<div id="section-stores" class="bg-white p-6 rounded-xl shadow border"><div class="flex justify-between items-center mb-3"><h2 class="font-bold text-red-500 text-sm">Manage Stores</h2><span id="storeCount" class="text-[11px] bg-gray-100 px-2 py-1 rounded"></span></div><input type="text" id="storeSearch" onkeyup="searchStores()" placeholder="Search Store Name..." class="w-full border p-2.5 rounded text-sm mb-3 bg-gray-50"><div id="adminStoreList"></div></div>

<div id="section-coupons" class="bg-white p-6 rounded-xl shadow border hidden"><div class="flex justify-between items-center mb-3"><h2 class="font-bold text-red-500 text-sm">Manage Coupons (Sorted by Sequence)</h2><span id="couponCount" class="text-[11px] bg-gray-100 px-2 py-1 rounded"></span></div><input type="text" id="couponSearch" onkeyup="searchCoupons()" placeholder="Search Coupon / Store..." class="w-full border p-2.5 rounded text-sm mb-3 bg-gray-50"><div id="adminCouponList"></div></div>

</div><script src="/js/admin.js"></script></body></html>
